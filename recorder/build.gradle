plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x3.screenrec'
    compileSdk 34

    defaultConfig {
        applicationId "com.x3.screenrec"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Папка модуля = recorder/, исходники в привычных для aapt-сборки местах
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Без внешних зависимостей — только framework API
}
