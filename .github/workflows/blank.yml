name: Build X3 Recorder (Android APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Java, Android 7-14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package name consistency
        run: |
          grep -q 'package="com.x3.screenrec"' recorder/AndroidManifest.xml
          grep -q 'android:versionCode="[0-9]\+"' recorder/AndroidManifest.xml
          grep -q 'android:versionName="[^"]\+"' recorder/AndroidManifest.xml
          grep -q 'android:name="com.x3.screenrec.MainActivity"' recorder/AndroidManifest.xml
          grep -q '^package com.x3.screenrec;' recorder/java/com/x3/screenrec/MainActivity.java
          test -f recorder/res/layout/activity_main.xml
          test -f recorder/res/values/strings.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        id: signing
        env:
          CB4_P12_BASE64: ${{ secrets.CB4_P12_BASE64 }}
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/x3-signing"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          if [[ -n "${CB4_P12_BASE64}" && -n "${CB4_P12_PASSWORD}" ]]; then
            # Реальный ключ из секретов
            if ! printf '%s' "${CB4_P12_BASE64}" \
                | tr -d '[:space:]' \
                | base64 --decode > "$KEY_DIR/X3.p12"; then
              echo "::error::CB4_P12_BASE64 is not valid Base64."
              exit 1
            fi

            chmod 600 "$KEY_DIR/X3.p12"

            if ! keytool -list -storetype PKCS12 \
                -keystore "$KEY_DIR/X3.p12" \
                -storepass:env CB4_P12_PASSWORD > /dev/null; then
              echo "::error::Cannot open the P12. Check the password."
              exit 1
            fi
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          else
            # Секретов нет: генерируем временный debug-ключ,
            # чтобы APK всё равно был установочным.
            # Внимание: каждый билд будет подписан НОВЫМ ключом —
            # обновление поверх потребует удалить старую версию.
            STOREPASS="x3debugkey"
            keytool -genkeypair \
              -v -keystore "$KEY_DIR/X3.p12" -storetype PKCS12 \
              -alias x3debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$STOREPASS" \
              -dname "CN=X3 Debug, OU=X3, O=X3, C=DE" > /dev/null
            echo "$STOREPASS" > "$KEY_DIR/storepass"
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate R.java and package resources
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          SDK_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p build/gen build/classes out
          "$BT/aapt" package \
            -J build/gen \
            -M recorder/AndroidManifest.xml \
            -S recorder/res \
            -I "$SDK_JAR" \
            --version-code "$(sed -n 's/.*android:versionCode="\([0-9]\+\).*/\1/p' recorder/AndroidManifest.xml)" \
            --version-name "$(sed -n 's/.*android:versionName="\([^"]\+\)".*/\1/p' recorder/AndroidManifest.xml)" \
            -F out/unsigned.apk

      - name: Compile Java
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          SDK_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          "$JAVA_HOME/bin/javac" \
            -source 11 -target 11 \
            -bootclasspath "$SDK_JAR" \
            -classpath "$SDK_JAR" \
            -encoding UTF-8 \
            -d build/classes \
            build/gen/com/x3/screenrec/R.java \
            $(find recorder/java -name '*.java')

      - name: DEX and add to APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          SDK_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p build/dex
          "$BT/d8" --release --lib "$SDK_JAR" --min-api 24 \
            --output build/dex $(find build/classes -name '*.class')
          (cd build/dex && zip -X ../../out/unsigned.apk classes.dex)

      - name: Align
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v 4 out/unsigned.apk out/aligned.apk

      - name: Sign APK
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
          CB4_KEY_ALIAS: ${{ secrets.CB4_KEY_ALIAS }}
          CB4_KEY_PASSWORD: ${{ secrets.CB4_KEY_PASSWORD || secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KEY_DIR="$RUNNER_TEMP/x3-signing"

          if [[ "${SIGNING_MODE}" == "generated" ]]; then
            STOREPASS="$(cat "$KEY_DIR/storepass")"
            "$BT/apksigner" sign \
              --ks "$KEY_DIR/X3.p12" --ks-type PKCS12 \
              --ks-pass "pass:$STOREPASS" --key-pass "pass:$STOREPASS" \
              --ks-key-alias x3debug \
              --out X3Recorder.apk out/aligned.apk
            echo "Signed with a temporary debug key (no repository secrets)."
          else
            SIGN_ARGS=(
              --ks "$KEY_DIR/X3.p12"
              --ks-type PKCS12
              --ks-pass env:CB4_P12_PASSWORD
              --key-pass env:CB4_KEY_PASSWORD
            )

            if [[ -n "${CB4_KEY_ALIAS}" ]]; then
              SIGN_ARGS+=("--ks-key-alias" "$CB4_KEY_ALIAS")
            fi

            "$BT/apksigner" sign "${SIGN_ARGS[@]}" --out X3Recorder.apk out/aligned.apk
          fi

      - name: Verify
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging X3Recorder.apk | head -n 8
          "$BT/apksigner" verify --verbose --print-certs X3Recorder.apk
          "$BT/aapt" dump badging X3Recorder.apk | grep -q "launchable-activity" \
            || { echo "::error::No launchable activity found."; exit 1; }

      # Если ключ сгенерирован (секретов нет) — отдаём его в артефакте,
      # чтобы ОДИН раз сохранить как секреты CB4_P12_BASE64/CB4_P12_PASSWORD
      # и получать стабильную подпись.
      - name: Upload debug keystore (one-time)
        if: ${{ steps.signing.outputs.mode == 'generated' }}
        uses: actions/upload-artifact@v4
        with:
          name: X3-debug-keystore
          path: |
            ${{ runner.temp }}/x3-signing/X3.p12
            ${{ runner.temp }}/x3-signing/storepass
          if-no-files-found: error

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/x3-signing"

      - uses: actions/upload-artifact@v4
        with:
          name: X3Recorder-APK
          path: X3Recorder.apk
          if-no-files-found: error
